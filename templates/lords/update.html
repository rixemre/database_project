{% extends "base.html" %}

{% block title %}Edit Lord{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-secondary text-light">
                <div class="card-header border-secondary">
                    <i class="bi bi-pencil-square text-warning"></i> Edit Lord
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input name="name" class="form-control bg-dark text-light border-secondary"
                                value="{{ lord.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select bg-dark text-light border-secondary">
                                <option value="" {% if not lord.gender %}selected{% endif %}>Unknown</option>
                                <option value="Male" {% if lord.gender=='Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if lord.gender=='Female' %}selected{% endif %}>Female</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="age" min="0"
                                class="form-control bg-dark text-light border-secondary" value="{{ lord.age }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Level</label>
                            <input type="number" name="level" min="0"
                                class="form-control bg-dark text-light border-secondary" value="{{ lord.level }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Culture ID</label>
                            <input type="number" name="culture_id" min="0"
                                class="form-control bg-dark text-light border-secondary" value="{{ lord.culture_id }}">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('lords_page') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Back
                            </a>
                            <button class="btn btn-primary">
                                <i class="bi bi-save"></i> Save
                            </button>
                        </div>
                    </form>

                    <hr class="border-secondary">

                    <form method="POST" action="{{ url_for('delete_lord', lord_id=lord.lord_id) }}"
                        onsubmit="return confirm('Delete this lord?');">
                        <button class="btn btn-outline-danger w-100">
                            <i class="bi bi-trash"></i> Delete Lord
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
