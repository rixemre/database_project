{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm mb-4 bg-dark">
  <div class="card-header bg-dark-subtle">
    <h2 class="h5 mb-0"><i class="bi bi-pencil-fill text-warning"></i> Update Shield (ID: {{ item_id }})</h2>
    <h3 class="h6 text-white-50">{{ shield.Item_Name }}</h3>
  </div>
  <div class="card-body">
    <form action="{{ url_for('update_shield', item_id=item_id) }}" method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="item_name" class="form-label">Shield Name</label>
          <input type="text" class="form-control" id="item_name" name="item_name" value="{{ shield.Item_Name }}" required>
        </div>
        <div class="col-md-6">
          <label for="weight" class="form-label">Weight</label>
          <input type="text" class="form-control" id="weight" name="weight" value="{{ shield.Weight }}" required>
        </div>
      </div>
      <div class="row g-3 mt-2">
        <div class="col-md-6">
          <label for="culture_id" class="form-label">Culture</label>
          <select id="culture_id" name="culture_id" class="form-select">
            {% for culture in cultures %}
            <option value="{{ culture.Culture_Type_ID }}" {% if culture.Culture_Type_ID == shield.Culture_ID %}selected{% endif %}>
              {{ culture.Culture_Type_Name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6 d-flex align-items-end">
          <div class="form-check form-switch fs-5">
            <input class="form-check-input" type="checkbox" id="civilian" name="civilian" value="Yes" role="switch" {% if shield.Civilian == 'Yes' %}checked{% endif %}>
            <label class="form-check-label" for="civilian">Civilian Item</label>
          </div>
        </div>
      </div>
      
      <hr class="my-4">
      
      <h5 class="text-white-50">Shield Stats</h5>
      <div class="row g-3">
        <div class="col-md-3">
          <label for="Durability" class="form-label">Durability</label>
          <input type="number" class="form-control" id="Durability" name="Durability" value="{{ shield.Durability }}" min="0">
        </div>
        <div class="col-md-3">
          <label for="Resistance" class="form-label">Resistance</label>
          <input type="number" class="form-control" id="Resistance" name="Resistance" value="{{ shield.Resistance }}" min="0">
        </div>
        <div class="col-md-2">
          <label for="Size" class="form-label">Size</label>
          <input type="number" class="form-control" id="Size" name="Size" value="{{ shield.Size }}" min="0">
        </div>
        <div class="col-md-2">
          <label for="Speed" class="form-label">Speed</label>
          <input type="number" class="form-control" id="Speed" name="Speed" value="{{ shield.Speed }}" min="0">
        </div>
        <div class="col-md-2">
          <label for="BaseValue" class="form-label">BaseValue</label>
          <input type="number" class="form-control" id="BaseValue" name="BaseValue" value="{{ shield.BaseValue }}" min="0">
        </div>
      </div>
      
      <button type="submit" class="btn btn-success mt-4"><i class="bi bi-check-circle-fill"></i> Save Changes</button>
      <a href="{{ url_for('shields_page') }}" class="btn btn-secondary mt-4">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
