{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card bg-dark text-white border-warning shadow">
            <div class="card-header border-warning text-warning fw-bold">Edit Village: {{ village.name }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-white-50">Name</label>
                        <input type="text" name="name" class="form-control bg-dark text-white border-secondary" value="{{ village.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-white-50">Description</label>
                        <textarea name="description" class="form-control bg-dark text-white border-secondary" rows="3">{{ village.description or '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-white-50">Resource</label>
                            <input type="text" name="primary_resource" class="form-control bg-dark text-white border-secondary" value="{{ village.primary_resource }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-white-50">Hearth</label>
                            <input type="number" step="0.1" name="hearth" class="form-control bg-dark text-white border-secondary" value="{{ village.hearth }}">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">Save Changes</button>
                        <a href="{{ url_for('village_detail', vid=village.village_id) }}" class="btn btn-outline-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
